name: Docker CI (Build & Push)

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy source code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Login Docker Hub
    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build + Push Backend
    - name: Build & Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: xuanho17102004/project-chat-social-backend:latest

    # 4. Build + Push AI
    - name: Build & Push AI
      uses: docker/build-push-action@v5
      with:
        context: ./server-ai
        push: true
        tags: xuanho17102004/project-chat-social-server-ai:latest

    # 5. Kafka server
    - name: Build & Push Kafka
      uses: docker/build-push-action@v5
      with:
        context: ./kafka-server
        push: true
        tags: xuanho17102004/project-chat-social-kafka-server:latest

    # 6. Rabbit worker
    - name: Build & Push Rabbit
      uses: docker/build-push-action@v5
      with:
        context: ./rabbitmq
        push: true
        tags: xuanho17102004/project-chat-social-rabbitmq-worker:latest
