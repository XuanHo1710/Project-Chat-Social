version: "3.8"

services:
  # --- Kafka Stack ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: social-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - social-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: social-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - social-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: social-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - social-network
    restart: unless-stopped

  # --- RabbitMQ Stack ---
  rabbitmq:
    image: rabbitmq:4.2.3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672" # AMQP (app connect)
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: 123123123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - social-network
    restart: unless-stopped

  # --- Application Services ---
  kafka-server-app:
    build:
      context: ./kafka-server
      dockerfile: Dockerfile
    container_name: kafka-server-app
    volumes:
      - ./kafka-server:/app
      - /app/node_modules
    depends_on:
      - kafka
    env_file:
      - ./kafka-server/.env
    environment:
      # Override .env config for Docker environment
      - KAFKA_BROKER=kafka:29092
    command: npm run start:dev
    networks:
      - social-network
    restart: unless-stopped

  rabbitmq-worker-app:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq-worker-app
    volumes:
      - ./rabbitmq:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
    env_file:
      - ./rabbitmq/.env
    environment:
      # Override .env config for Docker environment
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://user:123123123@rabbitmq:5672
      # Connect to AI Server running on Host machine
      - AI_SERVER_URL=http://host.docker.internal:8000/api/v1
    command: npm run start:dev
    networks:
      - social-network
    restart: unless-stopped

volumes:
  rabbitmq_data:

networks:
  social-network:
    driver: bridge
