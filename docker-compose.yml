# ┌──────────────────────────────────────────────────────────────────────────────────────┐
# │  Project-Chat-Social — Production Docker Compose                                    │
# │                                                                                      │
# │  SERVICE           PORT          HTTP ROUTES           NOTES                        │
# │  ─────────────────────────────────────────────────────────────────────────────────  │
# │  nginx             :80 (host)    entry point           reverse proxy                │
# │    ├─ /api/v1/*  ──────────────► backend :8080         NestJS globalPrefix=api      │
# │    ├─ /api/v2/*  ──────────────► backend :8080         versioning /v1 /v2           │
# │    └─ /socket.io/──────────────► backend :8080         WebSocket upgrade            │
# │                                                                                      │
# │  backend           :8080 → :5000 /api/v1/* /api/v2/*   HTTP + Socket.IO            │
# │                                                         + RMQ consumer: backend_queue│
# │  kafka-server      :3002 (internal only)  no public routes  Kafka consumer only     │
# │  rabbitmq-worker   NO HTTP PORT           pure RMQ microservice (social_queue)      │
# │  server-ai         :8000 (internal)       /api/v1/*          FastAPI                │
# │                                           /health  /docs                            │
# │                                                                                      │
# │  Frontend chạy riêng (host :1710, Next.js)                                          │
# │                                                                                      │
# │  docker compose up -d --build                                                        │
# │  docker compose up -d --scale backend=3                                              │
# └──────────────────────────────────────────────────────────────────────────────────────┘

services:
  # ── Infrastructure ──────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-123} --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-123123123}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "15672:15672" # Management UI — bỏ nếu không cần debug
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Application Services ────────────────────────────────────────────

  ollama:
    # Ollama LLM server — CPU-only, serves qwen2.5:3b
    # OpenAI-compatible API at http://ollama:11434/v1/chat/completions
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  ollama-pull:
    # One-shot init container — pulls the model then exits
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - app-net
    restart: "no"

  server-ai:
    # FastAPI — Recommendation + Chatbot
    # Vectors: Qdrant Cloud
    # LLM: Ollama (qwen2.5:3b via Docker, CPU-only)
    build:
      context: ./server-ai
      dockerfile: Dockerfile
    image: project-chat-social-server-ai:latest
    env_file: ./server-ai/.env
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  backend:
    # NestJS — listens on :8080 (env PORT=8080)
    # HTTP prefix: app.setGlobalPrefix('api') → all routes under /api/v1/* and /api/v2/*
    # WebSocket: /socket.io/ (Socket.IO on same port)
    # Also subscribes to RabbitMQ queue: backend_queue (Transport.RMQ)
    image: project-chat-social-backend:latest
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    env_file: ./backend/.env
    environment:
      PORT: "8080"
      NODE_ENV: production
      # ── localhost → Docker service names ──
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASS:-123123123}@rabbitmq:5672
      KAFKA_BROKER: kafka:9092
      AI_SERVER_URL: http://server-ai:8000/api/v1
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server-ai:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

  kafka-server:
    # NestJS Hybrid — HTTP :3002 (internal, no public routes) + Kafka consumer
    # Consumer groupId: newsfeed-consumer-group
    # NOT routed through nginx — internal processing only
    build:
      context: ./kafka-server
      dockerfile: Dockerfile
    image: project-chat-social-kafka-server:latest
    env_file: ./kafka-server/.env
    environment:
      NODE_ENV: production
      PORT: "3002"
      KAFKA_BROKER: kafka:9092
      AI_SERVER_URL: http://server-ai:8000/api/v1
    depends_on:
      kafka:
        condition: service_started
      server-ai:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

  rabbitmq-worker:
    # NestJS PURE microservice — NestFactory.createMicroservice() only
    # NO HTTP server, NO exposed port
    # Subscribes to RabbitMQ queue: social_queue (env RABBITMQ_QUEUE_NAME)
    # Calls server-ai for AI features via HTTP: /api/v1/...
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: project-chat-social-rabbitmq-worker:latest
    env_file: ./rabbitmq/.env
    environment:
      NODE_ENV: production
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASS:-123123123}@rabbitmq:5672
      # server-ai FastAPI prefix is /api/v1
      AI_SERVER_URL: http://server-ai:8000/api/v1
    depends_on:
      rabbitmq:
        condition: service_healthy
      server-ai:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

volumes:
  redis_data:
  zookeeper_data:
  kafka_data:
  rabbitmq_data:
  ollama_data:

networks:
  app-net:
    driver: bridge
