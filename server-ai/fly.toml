app = "server-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DEBUG = "false"
  EMBEDDING_PROVIDER = "custom"
  CUSTOM_MODEL_PATH = "./models/custom-social-embedding"
  CHROMA_COLLECTION_POSTS = "social_posts_v2"
  CHROMA_COLLECTION_HASHTAGS = "social_hashtags_v2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = 10000
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 2000

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[mounts]
  source = "chroma_data"
  destination = "/app/chroma_db"
