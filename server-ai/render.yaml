services:
  - type: web
    name: server-ai
    env: docker
    plan: starter # $7/month - free tier không đủ RAM
    region: singapore
    healthCheckPath: /health
    buildCommand: docker build -t server-ai .
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: EMBEDDING_PROVIDER
        value: custom
      - key: CUSTOM_MODEL_PATH
        value: ./models/custom-social-embedding
      - key: CHROMA_COLLECTION_POSTS
        value: social_posts_v2
      - key: CHROMA_COLLECTION_HASHTAGS
        value: social_hashtags_v2
      # Set these in Render Dashboard (secret)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
